[cfg]
# ping_timeout：ping超时时间设置，单位ms，如不设置,默认2000
ping_timeout=2000

# ping_times：单个IP地址最大ping重试次数，默认3
ping_times=3

# max_concurrent：最大并发ping数量，默认100
max_concurrent=100

# batch_size：批处理大小，默认500
batch_size=500

# status_online: 在线状态的显示文本
status_online=在线

# status_offline: 离线状态的显示文本
status_offline=离线

# head_name: IP列标题名称，默认IP
head_name=IP

# enable_progress: 是否显示进度条，默认true
enable_progress=true

# retry_delay: 重试间隔时间(ms)，默认100
retry_delay=100
